; sdkmod settings - copy this file next to libEGL.dll in the SDK's bin folder (Star 2.0 / DoJa 5.1).
; Every value is optional. Environment variables (SDKMOD_*) override this file, which is
; how launchers such as KWLR pass per-game choices.

[sdkmod]
; 1 = hide the phone skin, keypad and side panels (Ctrl+K toggles while playing)
game_only = 1
; starting window size, 1-4 (fitted to the screen; drag or Ctrl+1-4 to change)
scale = 2
; 1 = smooth scaling, 0 = sharp pixels (Ctrl+S toggles)
smooth = 0
; 0 = no right-click menu
context_menu = 1
; 1 = log every key message to sdkmod.log
keylog = 0

[keys]
; PC key = phone button. Keys not listed keep the emulator's own meaning:
;   Star:      arrows = D-pad, Enter = Select, Esc = Clear, 0-9, A/S/Z/X = soft keys 1-4
;   DoJa 5.1:  arrows = D-pad, Enter = Select, 0-9, A/S = soft keys 1-2, D = standby
;              (no Clear key and no soft keys 3-4: those mappings do nothing on DoJa)
; PC keys:  A-Z, 0-9, F1-F12, Numpad0-Numpad9, Up, Down, Left, Right, Space, Enter, Esc,
;           Backspace, Tab, Shift, Insert, Delete, Home, End, PageUp, PageDown,
;           Comma, Period, Slash, Semicolon, Quote, Minus, Equals, LBracket, RBracket, Backslash, Grave
; Phone:    Up, Down, Left, Right, Select, Clear, Soft1-Soft4, 0-9, Star, None (None disables the key)
W = Up
A = Left
S = Down
D = Right
Space = Select
J = Select
K = Clear
Backspace = Clear
Q = Soft1
E = Soft2
